  <rect class="b" width="64" height="64" rx="12"/>
  <rect class="f" x="38.5" y="12" width="6" height="40" rx="1"/>
  <rect class="f" x="29" y="12" width="6" height="40" rx="1"/>
  <rect class="f" x="19.5" y="12" width="6" height="19" rx="1"/>
</svg>
